      return std::string(buf);

interval:
  # Auto IR test: one slot per tick, so every slot is read every 1.6 s and a
  # quick cell swap (a few seconds out of the slot) is still seen.
  - interval: 400ms
    then:
      - if:
          condition:
            lambda: 'return id(auto_ir_test).state && id(mc3000_hub).is_connected() && !id(mc3000_hub).apply_busy();'
          then:
            - lambda: |-
                // Evaluate the slot requested on the previous tick (its reply is in).
                const int ch = id(air_rr) + 1;
                if (id(mc3000_hub).has_channel_data(ch)) {
                  const auto &c = id(mc3000_hub).channel_data(ch);
                  const int i = ch - 1;
                  const bool idle = c.status == mc3000_protocol::ChannelStatus::Standby ||
                                    c.status == mc3000_protocol::ChannelStatus::Done;
                  int seen = c.millivolts >= 2000 ? 1 : (c.millivolts < 1000 ? 0 : -2);
                  // A 0 V reading while a test/storage run is busy is a transition glitch.
                  if (seen == 0 && (!idle || id(ir_active)[i] || id(st_active)[i])) seen = -2;
                  if (seen >= 0) {
                    if (id(air_state)[i] == -1) {
                      id(air_state)[i] = seen;          // first reading: just record
                      id(air_cnt)[i] = 0;
                    } else if (seen == id(air_state)[i]) {
                      id(air_cnt)[i] = 0;
                    } else if (++id(air_cnt)[i] >= (seen == 1 ? 2 : 1)) {  // out: 1 reading, in: 2 (~1.6 s, contact bounce)
                      id(air_state)[i] = seen;
                      id(air_cnt)[i] = 0;
                      if (seen == 1) {
                        const bool sel[4] = {id(program_target_ch1).state, id(program_target_ch2).state,
                                             id(program_target_ch3).state, id(program_target_ch4).state};
                        if (!sel[i]) {
                          ESP_LOGI("auto_ir", "Ch%d: new cell (%u mV), channel not selected", ch, c.millivolts);
                        } else if (!idle || id(st_active)[i] || id(ir_active)[i]) {
                          ESP_LOGI("auto_ir", "Ch%d: new cell, but channel busy - no test", ch);
                        } else {
                          ESP_LOGI("auto_ir", "Ch%d: new cell (%u mV) -> IR test", ch, c.millivolts);
                          id(ir_test_start)->execute(ch);
                        }
                      } else {
                        ESP_LOGI("auto_ir", "Ch%d: cell removed", ch);
                      }
                    }
                  }
                }
                id(air_rr) = (id(air_rr) + 1) % 4;
                id(mc3000_hub).request_channel(id(air_rr) + 1);

switch:
  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 1
    name: "Ch1 Charging"
  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 2
    name: "Ch2 Charging"
  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 3
    name: "Ch3 Charging"
  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 4
    name: "Ch4 Charging"

  # "Apply to Channel N" targets for the shared program below - tick
  # whichever channels you want the same battery type/currents/cutoffs
  # pushed to, then press "Apply Program". These are just plain UI state
  # (optimistic template switches), not reflecting anything from the
  # charger itself.
  - platform: template
    id: program_target_ch1
    name: "Program: Apply to Channel 1"
    icon: "mdi:numeric-1-box-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: program_target_ch2
    name: "Program: Apply to Channel 2"
    icon: "mdi:numeric-2-box-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: program_target_ch3
    name: "Program: Apply to Channel 3"
    icon: "mdi:numeric-3-box-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: program_target_ch4
    name: "Program: Apply to Channel 4"
    icon: "mdi:numeric-4-box-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Auto IR test: on the channels ticked under "Apply to Channel N", start a
  # quick IR test whenever a new cell is inserted into an idle slot. Cells
  # already in a slot when this is switched on are left alone.
  - platform: template
    id: auto_ir_test
    name: "Program: Auto IR Test"
    icon: "mdi:omega"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          for (int i = 0; i < 4; i++) { id(air_state)[i] = -1; id(air_cnt)[i] = 0; }

# Shared charge-program controls: set these once, tick whichever "Apply to
# Channel N" switches above you want it sent to, then press the button -
# this is for "run the exact same test on 2/3/4 channels at once" instead
# of configuring each channel separately. Order of `options:` below must
# match mc3000_protocol::BatteryType / ChannelMode's enum order exactly -
# the button's lambda casts the selected *index*, not the text, to the enum.
select:
  - platform: template
    id: program_battery_type
    name: "Program: Battery Type"
    icon: "mdi:battery-unknown"
    optimistic: true
    restore_value: true
    initial_option: LiIon
    # Per-chemistry defaults taken from the official app (com.Sky_mc3000
    # 4.1.2, tools/Constant.java + AddActivity.initBatteryInfo): charge
    # cutoff, discharge cutoff, restart ("keep") voltage, storage voltage.
    # Applied only when the type actually changes, not on boot/restore.
    on_value:
      - lambda: |-
          auto sel = id(program_battery_type).active_index();
          if (!sel.has_value() || (int) *sel == id(last_battery_type)) return;
          const bool first = id(last_battery_type) < 0;
          id(last_battery_type) = (int) *sel;
          if (first) return;  // very first boot: keep YAML initial values
          //                           LiIon LiFe  4.35  NiMH  NiCd  NiZn  Enel  RAM   LTO
          static const float CHG[]  = {4200, 3600, 4350, 1650, 1650, 1900, 1650, 1650, 2850};
          static const float DIS[]  = {3000, 2900, 3300, 1000, 1000, 1200,  900,  900, 1800};
          static const float KEEP[] = {4150, 3550, 4250, 1350, 1350, 1600, 1350, 1450, 2700};
          static const float STOR[] = {3800, 3300, 3900,    0,    0,    0,    0,    0, 2400};
          const size_t t = *sel;
          if (t >= 9) return;
          auto set = [](number::Number *n, float v) { auto c = n->make_call(); c.set_value(v); c.perform(); };
          set(id(program_charge_cutoff_mv), CHG[t]);
          set(id(program_discharge_cutoff_mv), DIS[t]);
          set(id(program_keep_voltage_mv), KEEP[t]);
          if (STOR[t] > 0) set(id(program_storage_mv), STOR[t]);
          ESP_LOGI("presets", "Battery type #%u: defaults %.0f/%.0f/%.0f mV applied",
                   (unsigned) t, CHG[t], DIS[t], KEEP[t]);
    options:
      - LiIon
      - LiFe
      - "LiIon 4.35V"
      - NiMH
      - NiCd
      - NiZn
      - Eneloop
      - RAM
      - LTO
  - platform: template
    id: program_mode
    name: "Program: Mode"
    icon: "mdi:cog-outline"
    optimistic: true
    restore_value: true
    initial_option: Charge
    options:
      - Charge
      - Refresh
      - "Storage/Break-in"
      - Discharge
      - Cycle
      # Not a charger mode: runs Cycle C>D (capacity test), then on Done
      # automatically charges to "Program: Storage Voltage" (see script
      # storage_phase). Must stay LAST - indices 0-4 map 1:1 to the protocol.
      - "C>D>Storage"
  # Only used when Mode = Cycle. Order must match the protocol byte
  # (0 C>D, 1 C>D>C, 2 D>C, 3 D>C>D).
  - platform: template
    id: program_cycle_mode
    name: "Program: Cycle Mode"
    icon: "mdi:sync"
    optimistic: true
    restore_value: true
    initial_option: "C>D>C"
    options:
      - "C>D"
      - "C>D>C"
      - "D>C"
      - "D>C>D"

