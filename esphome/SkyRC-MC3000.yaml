button:
  - platform: template
    name: "Program: Storage Now Selected Channels"
    icon: "mdi:battery-50"
    on_press:
      - lambda: |-
          auto bt_idx = id(program_battery_type).active_index();
          const auto bt = (mc3000_protocol::BatteryType) (bt_idx.has_value() ? *bt_idx : 0);
          if (bt == mc3000_protocol::BatteryType::NiMH || bt == mc3000_protocol::BatteryType::NiCd ||
              bt == mc3000_protocol::BatteryType::Eneloop) {
            ESP_LOGW("storage_now", "Storage voltage is for Li chemistries, not %u", (unsigned) bt);
            return;
          }
          const bool sel[4] = {id(program_target_ch1).state, id(program_target_ch2).state,
                               id(program_target_ch3).state, id(program_target_ch4).state};
          for (int ch = 1; ch <= 4; ch++) {
            if (!sel[ch - 1]) continue;
            if (id(st_active)[ch - 1]) {
              ESP_LOGW("storage_now", "Ch%d already busy", ch);
              continue;
            }
            id(storage_now)->execute(ch);
          }
  - platform: template
    name: "Program: IR Test Selected Channels"
    icon: "mdi:omega"
    on_press:
      - lambda: |-
          const bool sel[4] = {id(program_target_ch1).state, id(program_target_ch2).state,
                               id(program_target_ch3).state, id(program_target_ch4).state};
          for (int ch = 1; ch <= 4; ch++)
            if (sel[ch - 1]) id(ir_test_start)->execute(ch);
  - platform: template
    name: "Program: Apply to Selected Channels"
    icon: "mdi:battery-sync-outline"
    on_press:
      # Build the program once, then queue it per selected channel. The hub
      # applies the queue one channel at a time (stop -> program -> read-back
      # -> start -> verify started, with retries); see mc3000.h apply_program().
      - lambda: |-
          auto bt_idx = id(program_battery_type).active_index();
          auto mode_idx = id(program_mode).active_index();
          if (!bt_idx.has_value() || !mode_idx.has_value()) {
            ESP_LOGW("program_apply", "Battery type / mode not selected, not applying.");
            return;
          }

          mc3000_protocol::ChargeProgram program;
          program.batteryType = (mc3000_protocol::BatteryType) (*bt_idx);
          const bool store_after = (*mode_idx == 5);  // "C>D>Storage"
          program.mode = store_after ? mc3000_protocol::ChannelMode::Cycle
                                     : (mc3000_protocol::ChannelMode) (*mode_idx);
          program.capacityMah = (uint16_t) id(program_capacity_mah).state;
          program.chargeCurrentMa = (uint16_t) id(program_charge_current_ma).state;
          program.dischargeCurrentMa = (uint16_t) id(program_discharge_current_ma).state;
          program.chargeCutoffMillivolts = (uint16_t) id(program_charge_cutoff_mv).state;
          program.dischargeCutoffMillivolts = (uint16_t) id(program_discharge_cutoff_mv).state;
          program.chargeEndCurrentMa = (uint16_t) id(program_charge_end_current_ma).state;
          program.tempCutoffC = (uint8_t) id(program_temp_cutoff_c).state;
          auto cyc_idx = id(program_cycle_mode).active_index();
          program.cycleMode = cyc_idx.has_value() ? (uint8_t) *cyc_idx : 1;
          program.cycleCount = (uint8_t) id(program_cycle_count).state;
          if (store_after) {
            program.cycleMode = 0;   // C>D
            program.cycleCount = 1;
          }
          // Arm (or disarm) the automatic storage phase per targeted channel;
          // a new program also cancels a running "Storage now" on that channel.
          if (id(program_target_ch1).state) { id(ch1_store_pending) = store_after; id(ch1_storage_phase) = false; id(st_active)[0] = false; }
          if (id(program_target_ch2).state) { id(ch2_store_pending) = store_after; id(ch2_storage_phase) = false; id(st_active)[1] = false; }
          if (id(program_target_ch3).state) { id(ch3_store_pending) = store_after; id(ch3_storage_phase) = false; id(st_active)[2] = false; }
          if (id(program_target_ch4).state) { id(ch4_store_pending) = store_after; id(ch4_storage_phase) = false; id(st_active)[3] = false; }
          program.chargeRestMinutes = (uint8_t) id(program_rest_min).state;
          program.dischargeRestMinutes = (uint8_t) id(program_rest_min).state;
          program.dischargeEndCurrentMa = (uint16_t) id(program_discharge_end_current_ma).state;
          program.timeCutoffMinutes = (uint16_t) id(program_time_cutoff_min).state;
          program.keepVoltageMillivolts = (uint16_t) id(program_keep_voltage_mv).state;
          const bool is_ni = program.batteryType == mc3000_protocol::BatteryType::NiMH ||
                             program.batteryType == mc3000_protocol::BatteryType::NiCd ||
                             program.batteryType == mc3000_protocol::BatteryType::Eneloop;
          program.negativeVoltageIncrementMv = is_ni ? (uint8_t) id(program_neg_delta_v_mv).state : 0;
          program.eddyCurrentTimesTen = is_ni ? (uint8_t) (id(program_trickle_current_ma).state / 10) : 0;
          // Charger's own Storage mode (Li chemistries; for Ni it is Break-in):
          // the target voltage travels in the charge-cutoff field, so send the
          // Storage Voltage setting there instead of the full-charge voltage.
          if (*mode_idx == 2 && !is_ni) {
            program.chargeCutoffMillivolts = (uint16_t) id(program_storage_mv).state;
            ESP_LOGI("program_apply", "Storage mode: target %.0f mV", id(program_storage_mv).state);
          }

          // The charger does not start by itself after a new program (the
          // official app also sends startCharge after the ack); apply_program
          // sends the start and checks it took. A channel above the safety
          // limit is stopped again by the temperature on_value failsafe.
          if (id(program_target_ch1).state) id(mc3000_hub).apply_program(1, program);
          if (id(program_target_ch2).state) id(mc3000_hub).apply_program(2, program);
          if (id(program_target_ch3).state) id(mc3000_hub).apply_program(3, program);
          if (id(program_target_ch4).state) id(mc3000_hub).apply_program(4, program);
