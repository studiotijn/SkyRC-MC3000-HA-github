# Example ESPHome config for the SkyRC MC3000 external_component.
#
# Adapted from a working esp32-c6-devkitc-1 + ble_client config (same board,
# same esp-idf framework requirement) - see README.md "Phase 2" for why
# esp-idf (not Arduino) is required here, unlike firmware/ which is Arduino.
#
# Fill in secrets.yaml (see secrets.yaml.example): wifi_ssid, wifi_password,
# api_key (any base64 32-byte key) and mc3000_mac, the BLE address of your
# charger (scan for it with the esp32_ble_tracker logs or a phone BLE app).

esphome:
  name: skyrc-mc3000
  friendly_name: "SkyRC-MC3000"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# Persist changed program settings to flash quickly (default is 1 min, so a
# reflash/reboot shortly after changing a value would lose it).
preferences:
  flash_write_interval: 10s

logger:
  level: DEBUG
  logs:
    esp32_ble: WARN
    esp32_ble_tracker: WARN
    ble_client: WARN

api:
  encryption:
    key: !secret api_key

ota:
  # Encrypted OTA (ESPHome 2026.9+); empty dict = reuse the api: encryption key.
  - platform: esphome
    encryption: {}

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/studiotijn/SkyRC-MC3000-HA-github
      ref: main
    components: [mc3000]
    refresh: 1d

esp32_ble:
  enable_on_boot: true

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  # BLE address of your charger (see the ESPHome log of a BLE scan)
  - mac_address: !secret mc3000_mac
    id: mc3000_client
    auto_connect: true

mc3000:
  id: mc3000_hub
  ble_client_id: mc3000_client
  update_interval: 5s
  # Program apply runs channel by channel; per attempt a channel must report
  # Charging/Discharging/Paused within 15 s of the start command, 3 attempts
  # (Mc3000Hub::start_timeout_ms_ / max_attempts_, see mc3000.h).

# Last measured charge / discharge capacity per channel, kept across
# phases (C>D>C) and reboots. Updated by the template sensors below.
globals:
  # Quick IR test: discharge current, how long it must hold, overall limit.
  - id: ir_test_current_ma
    type: int
    initial_value: '1000'
  - id: ir_test_stable_s       # current must hold this long before reading
    type: int
    initial_value: '15'
  - id: ir_test_timeout_s      # hard limit per channel
    type: int
    initial_value: '120'
  # "Storage now": tolerance around the storage voltage, rest before each
  # re-measure, and the maximum number of charge/discharge corrections.
  - id: storage_tol_mv
    type: int
    initial_value: '20'
  - id: storage_rest_s
    type: int
    initial_value: '120'
  - id: storage_max_rounds
    type: int
    initial_value: '4'
  - id: st_active
    type: std::array<bool, 4>
  - id: st_round
    type: std::array<int, 4>
  - id: st_last_mv      # in-band reading from the previous rest (0 = none)
    type: std::array<int, 4>
  - id: st_running      # a correction was started this round
    type: std::array<bool, 4>
  - id: st_dir          # +1 charging, -1 discharging (this round)
    type: std::array<int, 4>
  - id: st_stopping     # ESP-side stop already queued this round
    type: std::array<bool, 4>
  - id: st_zero         # consecutive 0 V readings (Standby glitch vs. no cell)
    type: std::array<int, 4>
  - id: ir_t0
    type: std::array<uint32_t, 4>
  - id: ir_ok_since
    type: std::array<uint32_t, 4>
  - id: ir_active       # an IR test is running on this channel
    type: std::array<bool, 4>
  # Auto IR test: per slot -1 = unknown (first reading after switching on),
  # 0 = empty, 1 = cell present; air_cnt counts consecutive readings that
  # disagree with that state (debounce); air_rr = round-robin channel.
  - id: air_state
    type: std::array<int, 4>
    initial_value: '{-1, -1, -1, -1}'
  - id: air_cnt
    type: std::array<int, 4>
  - id: air_rr
    type: int
    initial_value: '0'
  # Last battery type the per-chemistry defaults were applied for, so the
  # select's on_value at boot (restore) doesn't overwrite edited values.
  - id: last_battery_type
    type: int
    restore_value: true
    initial_value: '-1'
  - id: ch1_store_pending
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch1_storage_phase
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch2_store_pending
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch2_storage_phase
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch3_store_pending
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch3_storage_phase
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch4_store_pending
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch4_storage_phase
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch1_chg_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch1_dis_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch2_chg_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch2_dis_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch3_chg_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch3_dis_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch4_chg_cap
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ch4_dis_cap
    type: float
    restore_value: true
    initial_value: 'NAN'


# Storage phase for "C>D>Storage": after the C>D capacity test reports Done,
# charge the cell (CC/CV) to the storage voltage with the same currents.
script:
  # Start one quick IR test on channel ch with the shared program settings
  # (discharge at ir_test_current_ma). Used by the button and by Auto IR Test.
  - id: ir_test_start
    mode: parallel
    parameters:
      ch: int
    then:
      - lambda: |-
          auto bt_idx = id(program_battery_type).active_index();
          if (!bt_idx.has_value()) {
            ESP_LOGW("ir_test", "Battery type not selected, not testing.");
            return;
          }
          if (id(ir_active)[ch - 1]) {
            ESP_LOGW("ir_test", "Ch%d: IR test already running", ch);
            return;
          }
          mc3000_protocol::ChargeProgram p;
          p.batteryType = (mc3000_protocol::BatteryType) (*bt_idx);
          p.mode = mc3000_protocol::ChannelMode::Discharge;
          p.capacityMah = (uint16_t) id(program_capacity_mah).state;
          p.chargeCurrentMa = (uint16_t) id(program_charge_current_ma).state;
          p.dischargeCurrentMa = (uint16_t) id(ir_test_current_ma);
          p.chargeCutoffMillivolts = (uint16_t) id(program_charge_cutoff_mv).state;
          p.dischargeCutoffMillivolts = (uint16_t) id(program_discharge_cutoff_mv).state;
          p.chargeEndCurrentMa = (uint16_t) id(program_charge_end_current_ma).state;
          p.dischargeEndCurrentMa = (uint16_t) id(program_discharge_end_current_ma).state;
          p.tempCutoffC = (uint8_t) id(program_temp_cutoff_c).state;
          p.timeCutoffMinutes = 0;
          if (ch == 1) id(ch1_store_pending) = false;
          if (ch == 2) id(ch2_store_pending) = false;
          if (ch == 3) id(ch3_store_pending) = false;
          if (ch == 4) id(ch4_store_pending) = false;
          id(st_active)[ch - 1] = false;  // an IR test takes over: cancel "Storage now"
          id(ir_active)[ch - 1] = true;
          // fast: next channel starts ~1.5 s after the previous one; the
          // hub checks afterwards that every channel really runs.
          id(mc3000_hub).apply_program(ch, p, true, true);
          id(ir_test_finish)->execute(ch);
  # Quick internal-resistance test: the apply queue starts a discharge at
  # ir_test_current_ma; this waits until the current has held for
  # ir_test_stable_s, records the reading in "ChN IR Test" and stops the
  # channel again (also through the queue).
  - id: ir_test_finish
    mode: parallel
    parameters:
      ch: int
    then:
      - lambda: |-
          id(ir_t0)[ch - 1] = millis();
          id(ir_ok_since)[ch - 1] = 0;
          id(ir_active)[ch - 1] = true;
      # Poll this channel every 2 s. The MC3000 ramps the discharge current up
      # slowly (~0.5 A after 15 s), so wait until it has held >= 95 % of the
      # test current for ir_test_stable_s, or give up after ir_test_timeout_s.
      - while:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if (now - id(ir_t0)[ch - 1] > (uint32_t) id(ir_test_timeout_s) * 1000) return false;
              const uint32_t since = id(ir_ok_since)[ch - 1];
              return !(since != 0 && now - since >= (uint32_t) id(ir_test_stable_s) * 1000);
          then:
            - lambda: 'id(mc3000_hub).request_channel(ch);'
            - delay: 2s
            - lambda: |-
                const auto &c = id(mc3000_hub).channel_data(ch);
                // Compare with the current actually sent (may be capped by the
                // 15 W discharge budget when several slots test at once).
                const uint16_t set_ma = id(mc3000_hub).applied_discharge_ma(ch);
                const float want = (set_ma > 0 ? set_ma : id(ir_test_current_ma)) * 0.95f;
                const bool at_current = c.status == mc3000_protocol::ChannelStatus::Discharge &&
                                        c.milliamps >= want;
                if (!at_current) id(ir_ok_since)[ch - 1] = 0;
                else if (id(ir_ok_since)[ch - 1] == 0) id(ir_ok_since)[ch - 1] = millis();
      - lambda: 'id(mc3000_hub).request_channel(ch);'
      - delay: 2s
      - lambda: |-
          const auto &c = id(mc3000_hub).channel_data(ch);
          const uint32_t since = id(ir_ok_since)[ch - 1];
          const bool stable = since != 0 && millis() - since >= (uint32_t) id(ir_test_stable_s) * 1000;
          const float r = c.resistanceMilliohm;
          sensor::Sensor *out[4] = {id(ch1_ir_test), id(ch2_ir_test), id(ch3_ir_test), id(ch4_ir_test)};
          if (c.status == mc3000_protocol::ChannelStatus::Discharge && r > 0) {
            if (stable)
              ESP_LOGI("ir_test", "Ch%d: %.0f mOhm at %.3f V, %u mA (stable %u s)", ch, r,
                       c.millivolts / 1000.0f, c.milliamps, (unsigned) id(ir_test_stable_s));
            else
              ESP_LOGW("ir_test", "Ch%d: %.0f mOhm, but current never held %u mA (now %u mA)", ch, r,
                       id(mc3000_hub).applied_discharge_ma(ch), c.milliamps);
            out[ch - 1]->publish_state(r);
          } else {
            ESP_LOGW("ir_test", "Ch%d: no reading (status %s)", ch,
                     mc3000_protocol::channelStatusName(c.status));
            out[ch - 1]->publish_state(NAN);
          }
      - lambda: |-
          id(mc3000_hub).queue_stop(ch);
          id(ir_active)[ch - 1] = false;

  # "Storage now": bring a cell to the storage voltage as fast as the cell's
  # program currents allow - charge OR discharge, never both - then rest /
  # re-measure / correct until it holds. The charger does not stop a discharge
  # at a voltage this high, so the ESP polls the channel every 2 s and stops it
  # where the cell should relax to the target (terminal voltage +/- I*R).
  # Stable = inside the band on two consecutive rests that differ by <= 5 mV.
  - id: storage_now
    mode: parallel
    max_runs: 4
    parameters:
      ch: int
    then:
      - lambda: |-
          id(st_active)[ch - 1] = true;
          id(st_round)[ch - 1] = 0;
          id(st_last_mv)[ch - 1] = 0;
          id(st_zero)[ch - 1] = 0;
          // Report automation: treat as storage phase (notification, no report).
          if (ch == 1) { id(ch1_store_pending) = false; id(ch1_storage_phase) = true; }
          if (ch == 2) { id(ch2_store_pending) = false; id(ch2_storage_phase) = true; }
          if (ch == 3) { id(ch3_store_pending) = false; id(ch3_storage_phase) = true; }
          if (ch == 4) { id(ch4_store_pending) = false; id(ch4_storage_phase) = true; }
      - while:
          condition:
            lambda: 'return id(st_active)[ch - 1];'
          then:
            - lambda: 'id(mc3000_hub).request_channel(ch);'
            - delay: 2s
            # ---- decide: done / rest again / charge / discharge ----
            - lambda: |-
                text_sensor::TextSensor *ts[4] = {id(ch1_storage_status), id(ch2_storage_status),
                                                  id(ch3_storage_status), id(ch4_storage_status)};
                const auto &c = id(mc3000_hub).channel_data(ch);
                const int target = (int) id(program_storage_mv).state;
                const int v = c.millivolts;
                const int diff = v - target;
                char b[80];
                id(st_running)[ch - 1] = false;
                id(st_stopping)[ch - 1] = false;
                if ((uint8_t) c.status >= 128) {
                  snprintf(b, sizeof(b), "Fout: %s", mc3000_protocol::channelStatusName(c.status));
                  ts[ch - 1]->publish_state(b);
                  id(st_active)[ch - 1] = false;
                  return;
                }
                if (v < 1000) {
                  // The charger sometimes reports 0 V right after a stop.
                  if (++id(st_zero)[ch - 1] >= 3) {
                    ts[ch - 1]->publish_state("Geen cel gedetecteerd");
                    id(st_active)[ch - 1] = false;
                  }
                  return;
                }
                id(st_zero)[ch - 1] = 0;
                if (abs(diff) <= id(storage_tol_mv)) {
                  const int last = id(st_last_mv)[ch - 1];
                  if (last != 0 && abs(v - last) <= 5) {
                    snprintf(b, sizeof(b), "Stabiel op %.3f V (doel %.3f V)", v / 1000.0f, target / 1000.0f);
                    ts[ch - 1]->publish_state(b);
                    ESP_LOGI("storage_now", "Ch%d: %s", ch, b);
                    id(st_active)[ch - 1] = false;
                    return;
                  }
                  id(st_last_mv)[ch - 1] = v;
                  snprintf(b, sizeof(b), "Binnen band %.3f V, controle na rust", v / 1000.0f);
                  ts[ch - 1]->publish_state(b);
                  return;
                }
                if (id(st_round)[ch - 1] >= id(storage_max_rounds)) {
                  snprintf(b, sizeof(b), "Niet stabiel na %d rondes (%.3f V)", id(st_round)[ch - 1], v / 1000.0f);
                  ts[ch - 1]->publish_state(b);
                  id(st_active)[ch - 1] = false;
                  return;
                }
                id(st_last_mv)[ch - 1] = 0;
                const int round = ++id(st_round)[ch - 1];
                auto bt_idx = id(program_battery_type).active_index();
                mc3000_protocol::ChargeProgram p;
                p.batteryType = (mc3000_protocol::BatteryType) (bt_idx.has_value() ? *bt_idx : 0);
                p.capacityMah = (uint16_t) id(program_capacity_mah).state;
                p.tempCutoffC = (uint8_t) id(program_temp_cutoff_c).state;
                p.timeCutoffMinutes = (uint16_t) id(program_time_cutoff_min).state;
                p.chargeEndCurrentMa = (uint16_t) id(program_charge_end_current_ma).state;
                p.dischargeEndCurrentMa = (uint16_t) id(program_discharge_end_current_ma).state;
                // Round 1 at the cell's full program current; later rounds are
                // fine-tuning, so half current (min 100 mA).
                float chg = id(program_charge_current_ma).state, dis = id(program_discharge_current_ma).state;
                if (round > 1) { chg = std::max(100.0f, chg / 2); dis = std::max(100.0f, dis / 2); }
                p.chargeCurrentMa = (uint16_t) chg;
                p.dischargeCurrentMa = (uint16_t) dis;
                // Charger cutoffs stay at the normal limits as a safety net;
                // the ESP stops the channel itself at the storage voltage.
                p.chargeCutoffMillivolts = (uint16_t) id(program_charge_cutoff_mv).state;
                p.dischargeCutoffMillivolts = (uint16_t) id(program_discharge_cutoff_mv).state;
                if (diff > 0) {
                  p.mode = mc3000_protocol::ChannelMode::Discharge;
                  id(st_dir)[ch - 1] = -1;
                } else {
                  p.mode = mc3000_protocol::ChannelMode::Charge;
                  p.chargeCutoffMillivolts = (uint16_t) target;  // the charger honours this one (CC/CV)
                  id(st_dir)[ch - 1] = +1;
                }
                id(mc3000_hub).apply_program(ch, p);
                id(st_running)[ch - 1] = true;
                snprintf(b, sizeof(b), "%s %.3f -> %.3f V (ronde %d)", diff > 0 ? "Ontladen" : "Laden",
                         v / 1000.0f, target / 1000.0f, round);
                ts[ch - 1]->publish_state(b);
                ESP_LOGI("storage_now", "Ch%d: %s", ch, b);
            # ---- run the correction, stop it ourselves at the target ----
            - if:
                condition:
                  lambda: 'return id(st_active)[ch - 1] && id(st_running)[ch - 1];'
                then:
                  - wait_until:
                      condition:
                        lambda: 'return !id(mc3000_hub).apply_busy();'
                      timeout: 3min
                  - while:
                      condition:
                        lambda: |-
                          const auto s = id(mc3000_hub).channel_data(ch).status;
                          const bool running = s == mc3000_protocol::ChannelStatus::Charge ||
                                               s == mc3000_protocol::ChannelStatus::Discharge ||
                                               s == mc3000_protocol::ChannelStatus::Pause;
                          return id(st_active)[ch - 1] && running && !id(st_stopping)[ch - 1];
                      then:
                        - lambda: 'id(mc3000_hub).request_channel(ch);'
                        - delay: 2s
                        - lambda: |-
                            const auto &c = id(mc3000_hub).channel_data(ch);
                            const int target = (int) id(program_storage_mv).state;
                            const int v = c.millivolts;
                            if (v < 1000) return;
                            // Under load the terminal voltage is off by ~I*R; stop where
                            // the cell should relax to the target.
                            const float r = c.resistanceMilliohm > 0 ? c.resistanceMilliohm : 50;
                            const int comp = std::min(150, (int) (c.milliamps / 1000.0f * r));
                            const bool reached = id(st_dir)[ch - 1] < 0 ? v <= target - comp : v >= target + comp;
                            if (reached) {
                              ESP_LOGI("storage_now", "Ch%d: %.3f V under %u mA (comp %d mV) -> stop", ch,
                                       v / 1000.0f, c.milliamps, comp);
                              id(st_stopping)[ch - 1] = true;
                              id(mc3000_hub).queue_stop(ch);
                            }
                  - wait_until:
                      condition:
                        lambda: |-
                          const auto s = id(mc3000_hub).channel_data(ch).status;
                          return s != mc3000_protocol::ChannelStatus::Charge &&
                                 s != mc3000_protocol::ChannelStatus::Discharge &&
                                 s != mc3000_protocol::ChannelStatus::Pause;
                      timeout: 30s
            - if:
                condition:
                  lambda: 'return id(st_active)[ch - 1];'
                then:
                  - lambda: |-
                      text_sensor::TextSensor *ts[4] = {id(ch1_storage_status), id(ch2_storage_status),
                                                        id(ch3_storage_status), id(ch4_storage_status)};
                      if (id(st_running)[ch - 1]) ts[ch - 1]->publish_state("Rust, spanning stabiliseert");
                  - delay: !lambda 'return id(storage_rest_s) * 1000;'
      - lambda: 'id(st_active)[ch - 1] = false;'

  - id: storage_phase
    mode: parallel
    parameters:
      ch: int
    then:
      - delay: 5s
      - lambda: |-
          auto bt_idx = id(program_battery_type).active_index();
          mc3000_protocol::ChargeProgram program;
          program.batteryType = (mc3000_protocol::BatteryType) (bt_idx.has_value() ? *bt_idx : 0);
          program.mode = mc3000_protocol::ChannelMode::Charge;
          program.capacityMah = (uint16_t) id(program_capacity_mah).state;
          program.chargeCurrentMa = (uint16_t) id(program_charge_current_ma).state;
          program.dischargeCurrentMa = (uint16_t) id(program_discharge_current_ma).state;
          program.chargeCutoffMillivolts = (uint16_t) id(program_storage_mv).state;
          program.dischargeCutoffMillivolts = (uint16_t) id(program_discharge_cutoff_mv).state;
          program.chargeEndCurrentMa = (uint16_t) id(program_charge_end_current_ma).state;
          program.tempCutoffC = (uint8_t) id(program_temp_cutoff_c).state;
          program.timeCutoffMinutes = (uint16_t) id(program_time_cutoff_min).state;
          ESP_LOGI("storage", "Ch%d: C>D done, charging to storage voltage %.0f mV", ch, id(program_storage_mv).state);
          if (ch == 1) id(ch1_storage_phase) = true;
          if (ch == 2) id(ch2_storage_phase) = true;
          if (ch == 3) id(ch3_storage_phase) = true;
          if (ch == 4) id(ch4_storage_phase) = true;
          // Queued like the apply button, so four channels finishing at once
          // don't fire their commands over each other.
          id(mc3000_hub).apply_program(ch, program);

binary_sensor:
  - platform: template
    name: "Ch1 Storage Phase"
    icon: "mdi:battery-50"
    lambda: 'return id(ch1_storage_phase);'
  - platform: template
    name: "Ch2 Storage Phase"
    icon: "mdi:battery-50"
    lambda: 'return id(ch2_storage_phase);'
  - platform: template
    name: "Ch3 Storage Phase"
    icon: "mdi:battery-50"
    lambda: 'return id(ch3_storage_phase);'
  - platform: template
    name: "Ch4 Storage Phase"
    icon: "mdi:battery-50"
    lambda: 'return id(ch4_storage_phase);'
  - platform: ble_presence
    mac_address: !secret mc3000_mac
    name: "Advertising"

sensor:
  # Result of the quick IR test per channel (button "Program: IR Test ...").
  - platform: template
    id: ch1_ir_test
    name: "Ch1 IR Test"
    unit_of_measurement: "mΩ"
    icon: "mdi:omega"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    id: ch2_ir_test
    name: "Ch2 IR Test"
    unit_of_measurement: "mΩ"
    icon: "mdi:omega"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    id: ch3_ir_test
    name: "Ch3 IR Test"
    unit_of_measurement: "mΩ"
    icon: "mdi:omega"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: template
    id: ch4_ir_test
    name: "Ch4 IR Test"
    unit_of_measurement: "mΩ"
    icon: "mdi:omega"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 1
    voltage:
      name: "Ch1 Voltage"
    current:
      name: "Ch1 Current"
    capacity:
      name: "Ch1 Capacity"
    temperature:
      name: "Ch1 Temperature"
      on_value:
        - if:
            condition:
              lambda: 'return x >= id(safety_max_temp_c).state;'
            then:
              - logger.log:
                  level: WARN
                  format: "Ch1 at %.0f°C >= safety limit, stopping charge"
                  args: ['x']
              - lambda: 'id(mc3000_hub).stop_charge(1);'
    resistance:
      name: "Ch1 Resistance"

  - platform: mc3000
    mc3000_id: mc3000_hub
    channel: 2
    voltage:
      name: "Ch2 Voltage"
    current:
