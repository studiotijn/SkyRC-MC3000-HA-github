  - platform: template
    name: "Cooling Fan"
    icon: "mdi:fan"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(mc3000_hub).has_basic_data()) return {};
      const uint8_t m = id(mc3000_hub).basic_data().coolingFanMode;
      if (m == 0) return std::string("Auto");
      if (m == 1) return std::string("Off");
      if (m == 2) return std::string("On");
      if (m <= 9) return std::string("From ") + to_string(20 + (m - 3) * 5) + " °C";
      return std::string("Unknown (") + to_string(m) + ")";
  - platform: template
    name: "Charger Settings"
    icon: "mdi:cog"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(mc3000_hub).has_basic_data()) return {};
      const auto &b = id(mc3000_hub).basic_data();
      static const char *const kDisplayModes[] = {"Off", "Auto", "1 min", "3 min", "5 min", "Always on"};
      std::string disp = b.displayMode <= 5 ? kDisplayModes[b.displayMode] : "?";
      return std::string("Unit: ") + (b.fahrenheit ? "°F" : "°C") +
             ", Beep: " + (b.beep ? "on" : "off") +
             ", Display: " + disp +
