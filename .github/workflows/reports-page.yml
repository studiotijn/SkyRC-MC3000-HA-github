name: Build measurement history dashboard

# Regenerates the dashboard (tools/build_reports_page.py) from this repo's
# Releases. Started by tools/ha_report.py (Home Assistant) after every
# published or deleted measurement via workflow_dispatch. No release trigger:
# a release event runs the workflow file from the release's tag commit, so
# old tags kept running old, broken versions of this file.
on:
  workflow_dispatch:

permissions:
  contents: write

# Several builds can be requested within seconds: run one at a time.
concurrency:
  group: reports-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build_reports_page.py docs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update measurement history dashboard [skip ci]"
          git pull --rebase
          git push
