<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC3000 rapporten</title>
<style>body{margin:0;background:#0f1115;color:#9aa3b2;font:14px -apple-system,Segoe UI,Roboto,sans-serif;padding:1.5rem}</style>
</head>
<body>
<p id="msg">Rapporten laden...</p>
<script>
  // HA serves /local/ with a 31-day cache, so the iframe would keep showing an
  // old rapporten.html. This loader never changes; it fetches the real page
  // without cache on every view and replaces itself with it.
  fetch('rapporten.html?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function (e) { document.getElementById('msg').textContent = 'Rapporten laden mislukt: ' + e.message; });
</script>
</body>
</html>
